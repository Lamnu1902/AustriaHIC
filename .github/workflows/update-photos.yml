name: Update photos & deploy

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours (00:17, 06:17, 12:17, 18:17 UTC)
  workflow_dispatch:          # "Run workflow" button for manual refreshes
  push:
    branches: [main]

permissions:
  contents: write   # commit the refreshed photos.json
  pages: write      # deploy to GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch fresh photos
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/fetch-photos.mjs

      # Committing keeps a history of every pick, lets the next run fall back
      # to the last good photo, and keeps the repo "active" so GitHub doesn't
      # pause the schedule after 60 days.
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/photos.json
          git diff --cached --quiet || git commit -m "Update photos $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || echo "Push skipped (branch moved); deploy continues"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
